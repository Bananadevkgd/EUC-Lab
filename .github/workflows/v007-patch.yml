name: Integrate v0.0.7

on:
  push:
    paths:
      - '.github/workflows/v007-patch.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate v0.0.7 UI and telemetry
        run: |
          echo '' | base64 -d > /tmp/patch_v007.py
          python3 /tmp/patch_v007.py
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/euclab/app/AppUiV5.kt app/src/main/java/com/euclab/app/ble/VeteranFrameDecoder.kt app/build.gradle.kts
          git commit -m 'Integrate EUC Lab v0.0.7' || exit 0
          git push
