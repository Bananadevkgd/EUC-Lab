name: Apply v0.0.6 patch

on:
  push:
    paths:
      - 'tools/patch_v006.py'
      - '.github/workflows/patch-v006.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 tools/patch_v006.py
      - name: Commit v0.0.6
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          if git diff --cached --quiet; then
            echo "No application changes to commit"
            exit 0
          fi
          git commit -m "Apply EUC Lab v0.0.6"
          git push
