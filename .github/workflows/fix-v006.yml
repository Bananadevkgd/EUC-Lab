name: Fix v0.0.6 source

on:
  push:
    paths:
      - 'tools/fix_v006.py'
      - '.github/workflows/fix-v006.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore v0.0.5 base and apply safe v0.0.6 changes
        run: python3 tools/fix_v006.py
      - name: Commit fixed v0.0.6
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          if git diff --cached --quiet; then
            echo "No application changes to commit"
            exit 0
          fi
          git commit -m "Fix EUC Lab v0.0.6 source"
          git push
